<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <title>Example-SMART-App</title>
  </head>
  <body>
    <div>
      <h1>Hello powerchart</h1>
      <p><strong>Launch Code:</strong> <span id="display-launch">Loading...</span></p>
    </div>

    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>

    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>

    <script>
      function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
      }

      // 1. Get the launch parameter from the URL
      var launch = getUrlParameter('launch');

      // 2. Print it to the console for debugging
      console.log("Launch ID:", launch);

      // 3. Update the HTML element with the launch code
      if (launch) {
        document.getElementById('display-launch').innerText = launch;
      } else {
        document.getElementById('display-launch').innerText = "Not Found";
      }

      /* Commented out the actual authorization for now 
        so the page stays open and shows you the code.
        
        FHIR.oauth2.authorize({
          'client_id': '3e994b90-fc92-49ac-ad25-11a8f69830cb',
          'scope':  'patient/Patient.read patient/Observation.read launch online_access openid profile'
        });
      */
    </script>
  </body>
</html>
